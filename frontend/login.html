<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DHPS — Secure Login</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    /* ── CORNER DECORATIONS ── */
    .corner {
      position: fixed;
      width: 60px; height: 60px;
      z-index: 1;
      pointer-events: none;
    }
    .corner--tl { top: 24px; left: 24px; border-top: 1px solid var(--border-bright); border-left: 1px solid var(--border-bright); }
    .corner--tr { top: 24px; right: 24px; border-top: 1px solid var(--border-bright); border-right: 1px solid var(--border-bright); }
    .corner--bl { bottom: 24px; left: 24px; border-bottom: 1px solid var(--border-bright); border-left: 1px solid var(--border-bright); }
    .corner--br { bottom: 24px; right: 24px; border-bottom: 1px solid var(--border-bright); border-right: 1px solid var(--border-bright); }

    /* ── GLOW ── */
    .bg-glow {
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,234,255,0.06) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── CARD ── */
    .login-wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      animation: fade-up 0.7s 0.2s both;
    }

    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 48px 44px 44px;
      position: relative;
      clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
    }

    /* animated top line */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--cyan) 50%, transparent 100%);
      background-size: 200% 100%;
      animation: shimmer 3s linear infinite;
    }

    @keyframes shimmer { 0%{background-position: -200% 0} 100%{background-position: 200% 0} }
    @keyframes fade-up { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }

    /* ── HEADER ── */
    .login-eyebrow {
      font-family: var(--font-mono);
      font-size: 10px; color: var(--cyan);
      letter-spacing: 4px; text-transform: uppercase;
      margin-bottom: 12px;
      display: flex; align-items: center; gap: 10px;
    }
    .login-eyebrow::before { content: ''; display: block; width: 20px; height: 1px; background: var(--cyan); }

    .login-title {
      font-family: var(--font-display);
      font-size: 22px; font-weight: 900;
      color: #fff;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 6px;
    }
    .login-title span { color: var(--cyan); }

    .login-sub {
      font-family: var(--font-mono);
      font-size: 11px; color: var(--text-dim);
      letter-spacing: 1px;
      margin-bottom: 36px;
    }

    /* ── FORM ── */
    .field { margin-bottom: 20px; }

    .field-label {
      font-family: var(--font-mono);
      font-size: 10px; color: var(--text-dim);
      letter-spacing: 3px; text-transform: uppercase;
      display: block; margin-bottom: 8px;
    }

    .field-input-wrap { position: relative; }

    .field-input-wrap .field-icon {
      position: absolute;
      left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 14px;
      color: var(--text-dim);
      pointer-events: none;
      transition: color 0.2s;
    }

    .field input {
      width: 100%;
      padding: 13px 14px 13px 40px;
      background: rgba(0,0,0,0.45);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 1px;
      outline: none;
      border-radius: 0;
      transition: border-color 0.25s, box-shadow 0.25s;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    }

    .field input::placeholder { color: var(--text-dim); letter-spacing: 1px; }

    .field input:focus {
      border-color: var(--border-bright);
      box-shadow: 0 0 16px rgba(0,234,255,0.1);
      background: rgba(0,234,255,0.03);
    }

    .field input:focus + .field-icon,
    .field-input-wrap:focus-within .field-icon { color: var(--cyan); }

    /* eye toggle */
    .field-toggle {
      position: absolute;
      right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-dim); font-size: 14px;
      padding: 0; margin: 0;
      transition: color 0.2s;
      clip-path: none !important;
    }
    .field-toggle:hover { color: var(--cyan); background: none !important; box-shadow: none !important; }

    /* ── OPTIONS ROW ── */
    .field-options {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px;
    }

    .remember-wrap { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .remember-wrap input[type=checkbox] { display: none; }
    .custom-check {
      width: 14px; height: 14px;
      border: 1px solid var(--border-bright);
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; color: var(--cyan);
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .remember-wrap input:checked ~ .custom-check { background: var(--cyan); color: #000; }
    .remember-label { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); letter-spacing: 1px; }

    .forgot-link { font-family: var(--font-mono); font-size: 11px; color: var(--cyan); text-decoration: none; letter-spacing: 1px; opacity: 0.7; transition: opacity 0.2s; }
    .forgot-link:hover { opacity: 1; }

    /* ── SUBMIT ── */
    .login-btn {
      width: 100%;
      padding: 15px;
      background: var(--cyan);
      color: #000;
      font-family: var(--font-display);
      font-size: 11px; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase;
      border: none; cursor: pointer;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
      transition: all 0.25s;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .login-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s;
    }

    .login-btn:hover { background: #fff; box-shadow: 0 0 32px rgba(0,234,255,0.4); transform: translateY(-1px); }
    .login-btn:hover::after { transform: translateX(100%); }
    .login-btn:active { transform: translateY(0); }

    /* ── STATUS MSG ── */
    #loginMsg {
      font-family: var(--font-mono);
      font-size: 12px;
      text-align: center;
      letter-spacing: 1px;
      min-height: 18px;
      margin-bottom: 8px;
      transition: color 0.3s;
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0;
    }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-text { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); letter-spacing: 2px; }

    /* ── BOTTOM LINK ── */
    .login-footer-text {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }
    .login-footer-text a { color: var(--cyan); text-decoration: none; }
    .login-footer-text a:hover { text-decoration: underline; }

    /* ── SYSTEM INFO ── */
    .sys-info {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sys-info-item { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }
    .sys-info-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--green); box-shadow: 0 0 5px var(--green); margin-right: 5px; }

    /* ── SCANNING ANIMATION on success ── */
    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
      top: 0;
      transform: translateY(-2px);
      opacity: 0;
      transition: none;
    }
    .login-card.scanning .scan-line { animation: scan 1.2s ease-in-out; }

    @keyframes scan { 0%{top:0;opacity:1} 100%{top:100%;opacity:0} }

    /* ── GOOGLE BUTTON ── */
    .google-btn {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
      margin-bottom: 0;
    }
    .google-btn:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.3);
      box-shadow: 0 0 16px rgba(255,255,255,0.06);
    }
    .google-btn:active { transform: scale(0.99); }

    /* ── GOOGLE OVERLAY ── */
    #googleOverlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(3,8,16,0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .google-popup {
      background: #fff;
      border-radius: 8px;
      padding: 40px 36px;
      width: 340px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
      text-align: center;
      position: relative;
      animation: fade-up 0.3s both;
    }
    .gp-close {
      position: absolute; top: 12px; right: 14px;
      background: none; border: none; font-size: 20px;
      color: #888; cursor: pointer; line-height: 1;
    }
    .gp-logo { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
    .gp-logo span { color: #4285F4; }
    .gp-logo span:nth-child(2) { color: #EA4335; }
    .gp-logo span:nth-child(3) { color: #FBBC05; }
    .gp-logo span:nth-child(4) { color: #4285F4; }
    .gp-logo span:nth-child(5) { color: #34A853; }
    .gp-logo span:nth-child(6) { color: #EA4335; }
    .gp-subtitle { font-size: 13px; color: #555; margin-bottom: 24px; font-family: sans-serif; }
    .gp-email-input {
      width: 100%; padding: 12px 14px; border: 1px solid #ddd;
      border-radius: 4px; font-size: 14px; outline: none;
      box-sizing: border-box; margin-bottom: 8px;
      font-family: sans-serif; color: #333;
      transition: border-color 0.2s;
    }
    .gp-email-input:focus { border-color: #4285F4; box-shadow: 0 0 0 3px rgba(66,133,244,0.15); }
    .gp-error { font-size: 12px; color: #d93025; min-height: 16px; margin-bottom: 12px; font-family: sans-serif; text-align: left; }
    .gp-next-btn {
      width: 100%; padding: 11px;
      background: #4285F4; color: #fff; border: none;
      border-radius: 4px; font-size: 14px; font-weight: 500;
      cursor: pointer; font-family: sans-serif;
      transition: background 0.2s;
    }
    .gp-next-btn:hover { background: #3367d6; }
    .gp-divider { display: flex; align-items: center; gap: 10px; margin: 16px 0; }
    .gp-divider span { font-size: 11px; color: #999; font-family: sans-serif; }
    .gp-divider hr { flex: 1; border: none; border-top: 1px solid #eee; }
    .gp-accounts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .gp-account-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      border: 1px solid #eee; border-radius: 4px;
      cursor: pointer; transition: background 0.15s;
    }
    .gp-account-row:hover { background: #f5f5f5; }
    .gp-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600; color: #fff; flex-shrink: 0;
    }
    .gp-account-info { text-align: left; }
    .gp-account-name { font-size: 13px; font-weight: 500; color: #333; font-family: sans-serif; }
    .gp-account-email { font-size: 12px; color: #666; font-family: sans-serif; }
    .gp-footer { font-size: 11px; color: #999; font-family: sans-serif; margin-top: 12px; }
    .gp-footer a { color: #4285F4; text-decoration: none; }
    .gp-scanning {
      font-family: monospace; font-size: 11px; color: #4285F4;
      margin-top: 14px; letter-spacing: 1px;
    }

    /* error shake */
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%,60%{transform:translateX(-6px)}
      40%,80%{transform:translateX(6px)}
    }
    .shake { animation: shake 0.4s ease; }
  </style>
</head>
<body>

<div class="grid-bg"></div>
<div class="bg-glow"></div>

<!-- Corner decorations -->
<div class="corner corner--tl"></div>
<div class="corner corner--tr"></div>
<div class="corner corner--bl"></div>
<div class="corner corner--br"></div>

<div class="login-wrap">
  <div class="login-card" id="loginCard">
    <div class="scan-line"></div>

    <p class="login-eyebrow">Secure Access</p>
    <h1 class="login-title">DHPS <span>Portal</span></h1>
    <p class="login-sub">Authenticate to access the security dashboard</p>

    <!-- FORM -->
    <div class="field">
      <label class="field-label" for="username">Operator ID</label>
      <div class="field-input-wrap">
        <span class="field-icon">&#x1F464;</span>
        <input type="text" id="username" placeholder="Enter your operator ID" autocomplete="username">
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="password">Access Key</label>
      <div class="field-input-wrap">
        <span class="field-icon">&#x1F510;</span>
        <input type="password" id="password" placeholder="Enter your access key" autocomplete="current-password">
        <button class="field-toggle" onclick="togglePwd()" id="eyeBtn" title="Toggle visibility">&#x1F441;</button>
      </div>
    </div>

    <div class="field-options">
      <label class="remember-wrap">
        <input type="checkbox" id="rememberMe">
        <span class="custom-check" id="checkDisplay"></span>
        <span class="remember-label">Remember session</span>
      </label>
      <a href="#" class="forgot-link">Forgot key?</a>
    </div>

    <p id="loginMsg"></p>

    <button class="login-btn" onclick="handleLogin()">
      &#x25B6;&nbsp; Authenticate
    </button>

    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-text">OR</span>
      <span class="divider-line"></span>
    </div>

    <button class="google-btn" onclick="handleGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <p class="login-footer-text" style="margin-top:20px;">
      New operator? <a href="#">Request access &rarr;</a>
    </p>

    <div class="sys-info">
      <span class="sys-info-item"><span class="sys-info-dot"></span>System Online</span>
      <span class="sys-info-item">v2.4.1 // DHPS</span>
    </div>
  </div>
</div>

<script>
  /* ── CHECKBOX TOGGLE ── */
  const cb = document.getElementById('rememberMe');
  const cd = document.getElementById('checkDisplay');
  cb.addEventListener('change', () => { cd.textContent = cb.checked ? '✓' : ''; });

  /* ── PASSWORD TOGGLE ── */
  function togglePwd() {
    const inp = document.getElementById('password');
    const btn = document.getElementById('eyeBtn');
    if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
    else { inp.type = 'password'; btn.textContent = '👁'; }
  }

  /* ── LOGIN HANDLER ── */
  function handleLogin() {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;
    const msg  = document.getElementById('loginMsg');
    const card = document.getElementById('loginCard');
    const btn  = document.querySelector('.login-btn');

    msg.style.color = '';
    msg.textContent = '';

    if (!user || !pass) {
      msg.style.color = 'var(--orange)';
      msg.textContent = '⚠ All fields are required.';
      card.classList.add('shake');
      setTimeout(() => card.classList.remove('shake'), 400);
      return;
    }

    /* Demo credentials: admin / secure123 */
    if (user === 'admin' && pass === 'secure123') {
      msg.style.color = 'var(--green)';
      msg.textContent = '✔ Identity verified. Redirecting...';
      btn.textContent = 'ACCESS GRANTED';
      btn.style.background = 'var(--green)';
      card.classList.add('scanning');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1400);
    } else {
      msg.style.color = 'var(--red)';
      msg.textContent = '✘ Invalid credentials. Access denied.';
      card.classList.add('shake');
      setTimeout(() => card.classList.remove('shake'), 400);
    }
  }

  /* ── ENTER KEY ── */
  document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

  /* ── GOOGLE LOGIN ── */
  var _accounts = [
    { name: 'Security Admin', email: 'admin@dhps.secure', color: '#4285F4', initials: 'SA' },
    { name: 'Analyst One',    email: 'analyst@dhps.secure', color: '#34A853', initials: 'A1' },
  ];

  function handleGoogleLogin() {
    var ov = document.getElementById('googleOverlay');
    ov.style.display = 'flex';
    showAccountPicker();
  }

  function closeGooglePopup() {
    document.getElementById('googleOverlay').style.display = 'none';
  }

  function showAccountPicker() {
    var rows = _accounts.map(function(a) {
      return '<div class="gp-account-row" onclick="selectAccount(\''+a.email+'\',\''+a.name+'\')">'+
        '<div class="gp-avatar" style="background:'+a.color+'">'+a.initials+'</div>'+
        '<div class="gp-account-info"><div class="gp-account-name">'+a.name+'</div><div class="gp-account-email">'+a.email+'</div></div></div>';
    }).join('');
    rows += '<div class="gp-account-row" onclick="showEmailEntry()">'+
      '<div class="gp-avatar" style="background:#888;font-size:20px;">+</div>'+
      '<div class="gp-account-info"><div class="gp-account-name">Use another account</div></div></div>';

    document.getElementById('gpBody').innerHTML =
      '<button class="gp-close" onclick="closeGooglePopup()">&#x2715;</button>'+
      '<div class="gp-logo"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div>'+
      '<div class="gp-subtitle">Choose an account to continue to DHPS</div>'+
      '<div class="gp-accounts">'+rows+'</div>'+
      '<div class="gp-footer">Google will share your name and email with DHPS. <a href="#">Privacy Policy</a></div>';
  }

  function showEmailEntry() {
    document.getElementById('gpBody').innerHTML =
      '<button class="gp-close" onclick="closeGooglePopup()">&#x2715;</button>'+
      '<div class="gp-logo"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div>'+
      '<div class="gp-subtitle">Sign in with your Google account</div>'+
      '<input class="gp-email-input" id="gpEmail" type="email" placeholder="Email or phone">'+
      '<div class="gp-error" id="gpError"></div>'+
      '<button class="gp-next-btn" onclick="submitGoogleEmail()">Next</button>'+
      '<div class="gp-footer" style="margin-top:12px;"><a href="#">Create account</a></div>';
    setTimeout(function(){ var e=document.getElementById('gpEmail'); if(e) e.focus(); },100);
  }

  function submitGoogleEmail() {
    var email = (document.getElementById('gpEmail')||{}).value||'';
    var errEl = document.getElementById('gpError');
    if (!email || !email.includes('@')) { if(errEl) errEl.textContent='Enter a valid email address.'; return; }
    selectAccount(email, email.split('@')[0]);
  }

  function selectAccount(email, name) {
    document.getElementById('gpBody').innerHTML =
      '<div style="text-align:center;padding:20px 0;">'+
      '<div style="font-size:36px;margin-bottom:16px;">&#x1F510;</div>'+
      '<div class="gp-scanning" id="gpScanMsg">Verifying identity...</div>'+
      '<div style="margin-top:14px;height:3px;background:#eee;border-radius:2px;overflow:hidden;">'+
      '<div id="gpScanBar" style="height:100%;width:0%;background:#4285F4;transition:width 1.8s ease;"></div></div>'+
      '<div style="font-family:sans-serif;font-size:12px;color:#888;margin-top:12px;">'+email+'</div></div>';

    setTimeout(function(){ var b=document.getElementById('gpScanBar'); if(b) b.style.width='100%'; },50);
    var steps=['Verifying identity...','Checking clearance level...','Authenticating with DHPS...','Access granted!'];
    var si=0;
    var iv=setInterval(function(){
      si++;
      var el=document.getElementById('gpScanMsg');
      if(el&&si<steps.length) el.textContent=steps[si];
      if(si>=steps.length-1){
        clearInterval(iv);
        setTimeout(function(){
          closeGooglePopup();
          var msg=document.getElementById('loginMsg');
          var btn=document.querySelector('.login-btn');
          var card=document.getElementById('loginCard');
          msg.style.color='var(--green)';
          msg.textContent='\u2714 Google auth successful. Welcome, '+name+'!';
          btn.textContent='ACCESS GRANTED';
          btn.style.background='var(--green)';
          card.classList.add('scanning');
          setTimeout(function(){ window.location.href='dashboard.html'; },1400);
        },600);
      }
    },500);
  }
</script>

  <div class="google-popup">
    <div id="gpBody"></div>
  </div>
</div>

</body>
